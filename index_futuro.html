<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorre - Partidas de Rol</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/gorre.ico">
    <!-- Google Fonts: Montserrat & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Modo Oscuro */
            --bg-color: #0f0f0f;
            --text-color: #e1e1e6;
            --text-muted: #94a3b8;
            --accent-color: #0ea5e9;
            --accent-hover: #38bdf8;
            --logo-filter: invert(1) brightness(2);
            --card-bg: #1f1f1f;
            --card-border: #2e2f38;
        }

        body.light-mode {
            /* Modo Claro */
            --bg-color: #ccc4b6;
            --text-color: #1e293b;
            --text-muted: #475569;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --logo-filter: none;
            --card-bg: #ffffff;
            --card-border: #b5aba0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Botón de cambio de tema flotante en la esquina superior derecha */
        .btn-theme {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--text-color);
            transition: transform 0.2s, background-color 0.3s, color 0.3s, border-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-theme:hover {
            transform: scale(1.1);
            border-color: var(--accent-color);
        }

        /* Contenedor central de bienvenida */
        .welcome-container {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* Logo adaptativo que ocupa gran parte de la anchura */
        .logo-welcome {
            width: 100%;
            max-width: 480px;
            height: auto;
            filter: var(--logo-filter);
            transition: filter 0.3s;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
            max-width: 550px;
        }

        /* Grupo de botones de llamada a la acción */
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
            width: 100%;
        }

        .btn-primary-custom {
            background-color: var(--accent-color);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary-custom:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .btn-secondary-custom {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--card-border);
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-secondary-custom:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        /* Footer sutil inferior */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Ajustes responsive para móviles */
        @media (max-width: 480px) {
            .logo-welcome {
                max-width: 320px;
            }
            .welcome-subtitle {
                font-size: 1.05rem;
            }
            .action-buttons {
                flex-direction: column;
                width: 100%;
            }
            .btn-primary-custom, .btn-secondary-custom {
                width: 100%;
                box-sizing: border-box;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Botón superior derecho para cambiar de tema -->
    <button id="theme-toggle" class="btn-theme" title="Cambiar modo claro/oscuro">
        <i class="fa-solid fa-moon"></i>
    </button>

    <!-- Contenido principal de la portada -->
    <div class="welcome-container">
        <!-- Logo principal adaptable -->
        <img src="images/gorre_l.png" alt="Gorre Logo" id="logo-img" class="logo-welcome">
        
        <!-- Texto de bienvenida mejorado y atractivo -->
        <p class="welcome-subtitle">
            Bienvenido al archivo de crónicas. Explora las mesas abiertas, elige tu sistema y prepárate para la aventura. Si buscas un hueco en la partida, contacta directamente con nosotros.
        </p>

        <!-- Botones de navegación -->
        <div class="action-buttons">
            <!-- Enlaza a tu página de listado (puede ser index.html o partidas.html según lo que hayas nombrado) -->
            <a href="partidas.html" class="btn-primary-custom">
                <i class="fa-solid fa-dice-d20"></i> Ver Listado de Partidas
            </a>
            <!-- Enlace directo a Discord (puedes cambiar la URL por la tuya general) -->
            <a href="https://discord.gg/tu-enlace" target="_blank" class="btn-secondary-custom">
                <i class="fa-brands fa-discord"></i> Unirse al Discord
            </a>
        </div>
    </div>

    <footer>
        Gorre Roleplaying Experience &copy; 2026
    </footer>

    <script>
        const themeToggleBtn = document.getElementById("theme-toggle");
        
        function actualizarInterfaz() {
            const esClaro = document.body.classList.contains("light-mode");
            if (esClaro) {
                themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            } else {
                themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        }

        themeToggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("light-mode");
            actualizarInterfaz();
        });
    </script>
</body>
</html>
