<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Partidas - Gorre</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/gorre.ico">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Modo Oscuro */
            --bg-color: #0f0f14;
            --card-bg: #18191d;
            --card-border: #2a2b32;
            --text-color: #e1e1e6;
            --text-muted: #94a3b8;
            --accent-color: #00f0ff;
            --accent-hover: #00b8c4;
            --btn-text: #0f0f14;
            /* Degradado en modo oscuro: de #05203d hacia negro (#0f0f14) */
            --header-bg: linear-gradient(to bottom, #05203d, #0f0f14);
            --header-border: #1a4a82;
            --logo-filter: invert(1) brightness(2);
            --img-bg: #111215;
        }

        body.light-mode {
            /* Modo Claro: Cabecera con fondo #c9ddf2 */
            --bg-color: #ccc4b6;
            --card-bg: #ffffff;
            --card-border: #b5aba0;
            --text-color: #1e293b;
            --text-muted: #475569;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --btn-text: #ffffff;
            --header-bg: #c9ddf2;
            --header-border: #a4c4e5;
            --logo-filter: none;
            --img-bg: #f1f5f9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            background: var(--header-bg);
            border: 2px solid var(--header-border);
            border-radius: 12px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s, border-color 0.3s;
        }

        .logo-header {
            height: 50px;
            width: auto;
            margin-bottom: 15px;
            filter: var(--logo-filter);
            transition: filter 0.3s;
        }

        h1 {
            font-family: 'Cinzel', serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .btn-theme {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: 2px solid var(--header-border);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: transform 0.2s, background-color 0.3s;
            background-color: var(--bg-color);
        }

        .btn-theme:hover {
            transform: scale(1.1);
        }

        /* ==========================================
           CONTROLES DE FILTRADO Y BUSCADOR
           ========================================== */
        .controls-container {
            max-width: 1200px;
            margin: 0 auto 25px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid var(--card-border);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--accent-color);
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: var(--btn-text);
            border-color: var(--accent-color);
        }

        /* ==========================================
           CONTENEDOR Y TARJETAS DE PARTIDAS
           ========================================== */
        #contenedor-partidas {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card-partida {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .card-partida:hover {
            transform: translateY(-4px);
        }

        .card-img-container {
            width: 100%;
            height: 240px;
            background-color: var(--img-bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--card-border);
            transition: background-color 0.3s;
        }

        .card-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .card-img:hover {
            transform: scale(1.02);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: var(--card-border);
            color: var(--text-color);
            font-weight: 600;
        }

        .card-body h3 {
            font-family: 'Cinzel', serif;
            margin: 0 0 10px 0;
            font-size: 1.3rem;
        }

        .desc-container {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .desc-text {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0 0 5px 0;
        }

        .card-partida.expanded .desc-text {
            display: block;
            -webkit-line-clamp: unset;
        }

        .btn-toggle-desc {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 0;
            margin-top: 4px;
        }

        .btn-toggle-desc:hover {
            text-decoration: underline;
        }

        .aviso {
            font-size: 0.8rem;
            color: #f87171;
            margin-bottom: 12px;
            background: rgba(248, 113, 113, 0.1);
            padding: 6px;
            border-radius: 4px;
            border-left: 3px solid #f87171;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
        }

        .btn-jugar {
            background-color: var(--accent-color);
            color: var(--btn-text);
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-jugar:hover {
            background-color: var(--accent-hover);
        }

        .loading, .no-results {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <img src="images/gorre_l.png" alt="Gorre Logo" class="logo-header">
        <h1>Listado de Partidas</h1>
        <button id="theme-toggle" class="btn-theme" title="Cambiar modo claro/oscuro">🌙</button>
    </header>

    <div class="controls-container">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar por nombre, sistema, género...">
        <div id="filter-buttons" class="filter-buttons">
            <!-- Botones dinámicos -->
        </div>
    </div>

    <main>
        <div id="contenedor-partidas">
            <div class="loading">Cargando partidas del Google Sheet...</div>
        </div>
    </main>

    <script>
        const themeToggleBtn = document.getElementById("theme-toggle");
        themeToggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("light-mode");
            if (document.body.classList.contains("light-mode")) {
                themeToggleBtn.textContent = "☀️";
            } else {
                themeToggleBtn.textContent = "🌙";
            }
        });

        let listaPartidas = [];
        let lineaSeleccionada = "TODAS";

        async function cargarPartidas() {
            const url = "https://docs.google.com/spreadsheets/d/1hX6Y0wqFcoyBsIQXkgypgogijbrTSqZRJGRw5Lqh9Ek/export?format=tsv";
            const contenedor = document.getElementById("contenedor-partidas");

            try {
                const respuesta = await fetch(url);
                const texto = await respuesta.text();
                
                const filas = texto.split("\n");
                listaPartidas = [];

                for (let i = 1; i < filas.length; i++) {
                    if (!filas[i].trim()) continue;
                    
                    const columnas = filas[i].split("\t");
                    
                    const partida = {
                        titulo: columnas[0] || "",
                        linea: columnas[1] || "",
                        genero: columnas[2] || "",
                        descripcion: columnas[3] || "",
                        portada: columnas[4] || "",
                        aviso: columnas[5] || "",
                        jugadores: columnas[6] || "",
                        sesiones: columnas[7] || "",
                        linkDiscord: columnas[8] || "",
                        publicar: columnas[9] ? columnas[9].trim().toLowerCase() : ""
                    };

                    if (partida.publicar === "no") continue;
                    listaPartidas.push(partida);
                }

                generarBotonesLinea();
                renderizarPartidas(listaPartidas);

            } catch (error) {
                console.error("Error al obtener las partidas:", error);
                contenedor.innerHTML = "<p class='loading'>Hubo un error al cargar las partidas. Revisa la conexión o los permisos del Google Sheet.</p>";
            }
        }

        function generarBotonesLinea() {
            const contenedorBotones = document.getElementById("filter-buttons");
            const lineasUnicas = [...new Set(listaPartidas.map(p => p.linea).filter(l => l !== ""))];
            
            let htmlBotones = `<button class="filter-btn active" data-linea="TODAS">Todas</button>`;
            lineasUnicas.forEach(linea => {
                htmlBotones += `<button class="filter-btn" data-linea="${linea}">${linea}</button>`;
            });

            contenedorBotones.innerHTML = htmlBotones;

            const botones = contenedorBotones.querySelectorAll(".filter-btn");
            botones.forEach(btn => {
                btn.addEventListener("click", (e) => {
                    botones.forEach(b => b.classList.remove("active"));
                    e.target.classList.add("active");
                    lineaSeleccionada = e.target.getAttribute("data-linea");
                    filtrarYRenderizar();
                });
            });
        }

        function renderizarPartidas(partidasAMostrar) {
            const contenedor = document.getElementById("contenedor-partidas");
            contenedor.innerHTML = "";

            if (partidasAMostrar.length === 0) {
                contenedor.innerHTML = "<p class='no-results'>No se ha encontrado ninguna partida con esos criterios.</p>";
                return;
            }

            partidasAMostrar.forEach(partida => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "card-partida";
                
                tarjeta.innerHTML = `
                    ${partida.portada ? `
                        <div class="card-img-container">
                            <img src="${partida.portada}" alt="${partida.titulo}" class="card-img" onerror="this.parentElement.style.display='none'">
                        </div>
                    ` : ''}
                    <div class="card-body">
                        <div class="tags">
                            ${partida.linea ? `<span class="tag">${partida.linea}</span>` : ''}
                            ${partida.genero ? `<span class="tag">${partida.genero}</span>` : ''}
                        </div>
                        <h3>${partida.titulo}</h3>
                        <div class="desc-container">
                            <p class="desc-text">${partida.descripcion}</p>
                            ${partida.descripcion.length > 90 ? `<button class="btn-toggle-desc">+ info</button>` : ''}
                        </div>
                        ${partida.aviso ? `<div class="aviso"><strong>⚠️ Aviso:</strong> ${partida.aviso}</div>` : ''}
                        <div class="meta">
                            <span>👥 ${partida.jugadores ? partida.jugadores + ' jugadores' : 'Plazas abiertas'}</span>
                            <span>⏱️ ${partida.sesiones || 'Partida única'}</span>
                        </div>
                        ${partida.linkDiscord ? `<a href="${partida.linkDiscord}" target="_blank" class="btn-jugar">Unirse a Discord</a>` : ''}
                    </div>
                `;

                const btnToggle = tarjeta.querySelector('.btn-toggle-desc');
                if (btnToggle) {
                    btnToggle.addEventListener('click', () => {
                        tarjeta.classList.toggle('expanded');
                        if (tarjeta.classList.contains('expanded')) {
                            btnToggle.textContent = "- ver menos";
                        } else {
                            btnToggle.textContent = "+ info";
                        }
                    });
                }

                contenedor.appendChild(tarjeta);
            });
        }

        function filtrarYRenderizar() {
            const textoBusqueda = document.getElementById("search-input").value.toLowerCase().trim();

            const filtradas = listaPartidas.filter(partida => {
                const coincideLinea = (lineaSeleccionada === "TODAS" || partida.linea === lineaSeleccionada);
                const textoCompleto = `${partida.titulo} ${partida.linea} ${partida.genero} ${partida.descripcion}`.toLowerCase();
                const coincideTexto = textoCompleto.includes(textoBusqueda);

                return coincideLinea && coincideTexto;
            });

            renderizarPartidas(filtradas);
        }

        document.getElementById("search-input").addEventListener("input", filtrarYRenderizar);

        cargarPartidas();
    </script>
</body>
</html>
