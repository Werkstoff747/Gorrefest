<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Partidas - Gorre</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/gorre.ico">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           VARIABLES DE ESTILO Y COLORES
           ========================================== */
        :root {
            /* Modo Oscuro: Azul marino intenso (#05203d) */
            --bg-color: #031528;
            --card-bg: #05203d;
            --card-border: #0a386b;
            --text-color: #e1e1e6;
            --text-muted: #94a3b8;
            --accent-color: #00f0ff;
            --accent-hover: #00b8c4;
            --btn-text: #031528;
            --header-bg: #05203d;
            --logo-filter: invert(1) brightness(2);
        }

        /* Modo Claro: Azul clarito (#c9ddf2) */
        body.light-mode {
            --bg-color: #e8f1fc;
            --card-bg: #c9ddf2;
            --card-border: #a4c4e5;
            --text-color: #1e293b;
            --text-muted: #475569;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --btn-text: #ffffff;
            --header-bg: #c9ddf2;
            --logo-filter: none;
        }

        /* ==========================================
           ESTILOS GENERALES
           ========================================== */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            background-color: var(--header-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .logo-header {
            height: 50px;
            width: auto;
            margin-bottom: 15px;
            filter: var(--logo-filter);
            transition: filter 0.3s;
        }

        h1 {
            font-family: 'Cinzel', serif;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        /* Botón de cambio de tema (Sol / Luna) */
        .btn-theme {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: 2px solid var(--card-border);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: transform 0.2s, background-color 0.3s;
            background-color: var(--bg-color);
        }

        .btn-theme:hover {
            transform: scale(1.1);
        }

        /* ==========================================
           CONTENEDOR Y TARJETAS DE PARTIDAS
           ========================================== */
        #contenedor-partidas {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card-partida {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .card-partida:hover {
            transform: translateY(-4px);
        }

        /* Imagen reescalada para que no rompa la tarjeta */
        .card-img-container {
            width: 100%;
            height: 180px;
            background-color: #000;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.3s;
        }

        .card-img:hover {
            transform: scale(1.03);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: var(--card-border);
            color: var(--text-color);
            font-weight: 600;
        }

        .card-body h3 {
            font-family: 'Cinzel', serif;
            margin: 0 0 10px 0;
            font-size: 1.3rem;
        }

        /* Estilos para descripción y botón + info */
        .desc-container {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .desc-text {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0 0 5px 0;
            transition: all 0.3s ease;
        }

        /* Cuando la tarjeta está expandida */
        .card-partida.expanded .desc-text {
            display: block;
            -webkit-line-clamp: unset;
        }

        .btn-toggle-desc {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 0;
            margin-top: 4px;
        }

        .btn-toggle-desc:hover {
            text-decoration: underline;
        }

        .aviso {
            font-size: 0.8rem;
            color: #f87171;
            margin-bottom: 12px;
            background: rgba(248, 113, 113, 0.1);
            padding: 6px;
            border-radius: 4px;
            border-left: 3px solid #f87171;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
        }

        .btn-jugar {
            background-color: var(--accent-color);
            color: var(--btn-text);
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-jugar:hover {
            background-color: var(--accent-hover);
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo superior -->
        <img src="images/gorre_l.png" alt="Gorre Logo" class="logo-header">
        <!-- Título principal -->
        <h1>Listado de Partidas</h1>
        <!-- Botón de cambio de tema (Sol / Luna) -->
        <button id="theme-toggle" class="btn-theme" title="Cambiar modo claro/oscuro">🌙</button>
    </header>

    <main>
        <div id="contenedor-partidas">
            <div class="loading">Cargando partidas del Google Sheet...</div>
        </div>
    </main>

    <script>
        // Lógica del botón de cambio de tema (Sol ☀️ / Luna 🌙)
        const themeToggleBtn = document.getElementById("theme-toggle");
        themeToggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("light-mode");
            if (document.body.classList.contains("light-mode")) {
                themeToggleBtn.textContent = "☀️";
            } else {
                themeToggleBtn.textContent = "🌙";
            }
        });

        // Carga de datos del Google Sheet en formato TSV
        async function cargarPartidas() {
            const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTPdYPbgiZnzzdn_uUy7g0h4krVRmLznQaOeHekUXPLg0anbmHzss7GxQeqtwrweg7dKWBWZyDZgmnU/pub?output=tsv";
            const contenedor = document.getElementById("contenedor-partidas");

            try {
                const respuesta = await fetch(url);
                const texto = await respuesta.text();
                
                const filas = texto.split("\n");
                contenedor.innerHTML = "";

                for (let i = 1; i < filas.length; i++) {
                    if (!filas[i].trim()) continue;
                    
                    const columnas = filas[i].split("\t");
                    
                    const titulo = columnas[0] || "";
                    const linea = columnas[1] || "";
                    const genero = columnas[2] || "";
                    const descripcion = columnas[3] || "";
                    const portada = columnas[4] || "";
                    const aviso = columnas[5] || "";
                    const jugadores = columnas[6] || "";
                    const sesiones = columnas[7] || "";
                    const linkDiscord = columnas[8] || "";
                    const publicar = columnas[9] ? columnas[9].trim().toLowerCase() : "";

                    if (publicar === "no") continue;

                    const tarjeta = document.createElement("div");
                    tarjeta.className = "card-partida";
                    
                    // Estructura interna de la tarjeta
                    tarjeta.innerHTML = `
                        ${portada ? `
                            <div class="card-img-container">
                                <img src="${portada}" alt="${titulo}" class="card-img" onerror="this.parentElement.style.display='none'">
                            </div>
                        ` : ''}
                        <div class="card-body">
                            <div class="tags">
                                ${linea ? `<span class="tag">${linea}</span>` : ''}
                                ${genero ? `<span class="tag">${genero}</span>` : ''}
                            </div>
                            <h3>${titulo}</h3>
                            <div class="desc-container">
                                <p class="desc-text">${descripcion}</p>
                                ${descripcion.length > 90 ? `<button class="btn-toggle-desc">+ info</button>` : ''}
                            </div>
                            ${aviso ? `<div class="aviso"><strong>⚠️ Aviso:</strong> ${aviso}</div>` : ''}
                            <div class="meta">
                                <span>👥 ${jugadores ? jugadores + ' jugadores' : 'Plazas abiertas'}</span>
                                <span>⏱️ ${sesiones || 'Partida única'}</span>
                            </div>
                            ${linkDiscord ? `<a href="${linkDiscord}" target="_blank" class="btn-jugar">Unirse a Discord</a>` : ''}
                        </div>
                    `;

                    // Funcionalidad del botón "+ info" / "- ver menos"
                    const btnToggle = tarjeta.querySelector('.btn-toggle-desc');
                    if (btnToggle) {
                        btnToggle.addEventListener('click', () => {
                            tarjeta.classList.toggle('expanded');
                            if (tarjeta.classList.contains('expanded')) {
                                btnToggle.textContent = "- ver menos";
                            } else {
                                btnToggle.textContent = "+ info";
                            }
                        });
                    }

                    contenedor.appendChild(tarjeta);
                }

                if (contenedor.children.length === 0) {
                    contenedor.innerHTML = "<p class='loading'>No hay partidas publicadas en este momento.</p>";
                }

            } catch (error) {
                console.error("Error al obtener las partidas:", error);
                contenedor.innerHTML = "<p class='loading'>Hubo un error al cargar las partidas. Revisa la conexión o los permisos del Google Sheet.</p>";
            }
        }

        cargarPartidas();
    </script>
</body>
</html>
