<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Partidas - Gorre</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/gorre.ico">
    <!-- Google Fonts: Montserrat & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Modo Oscuro */
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --card-border: #415a77;
            --text-color: #e0e1dd;
            --text-muted: #778da9;
            --accent-color: #415a77;
            --accent-hover: #778da9;
            --header-bg: #415a77;
            --header-border: #415a77;
            --header-text: #ffffff;
            --logo-filter: invert(1) brightness(1.8);
            --img-bg: #0d1b2a;
            --warning-bg: rgba(224, 225, 221, 0.08);
            --warning-text: #8b8c89;
            --tag-bg: #0d1b2a;
            --discord-bg: var(--accent-color);
            --discord-hover: #778da9;
            --discord-text: #fb8500;
            --discord-hover-text: #ffffff;
        }

        body.light-mode {
            /* Modo Claro */
            --bg-color: #e7ecef;
            --card-bg: #ffffff;
            --card-border: #6096ba;
            --text-color: #274c77;
            --text-muted: #8b8c89;
            --accent-color: #274c77;
            --accent-hover: #6096ba;
            --header-bg: #8ecae6;
            --header-border: #6096ba;
            --header-text: #023047;
            --logo-filter: none;
            --img-bg: #f8f9fa;
            --warning-bg: #f1f3f5;
            --warning-text: #8b8c89;
            --tag-bg: #d7e3fc;
            --discord-bg: #274c77;
            --discord-hover: #6096ba;
            --discord-text: #ffffff;
            --discord-hover-text: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            background: var(--header-bg);
            border: 2px solid var(--header-border);
            border-radius: 12px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            transition: background 0.3s, border-color 0.3s;
        }

        .logo-header {
            height: 50px;
            width: auto;
            margin-bottom: 15px;
            filter: var(--logo-filter);
            transition: filter 0.3s;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            color: var(--header-text);
        }

        /* ==========================================
           CONTROLES DE FILTRADO, BUSCADOR Y DESPLEGABLES
           ========================================== */
        .controls-container {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-filter-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .select-filters-row {
            display: flex;
            gap: 10px;
        }

        .search-input, select.search-input {
            flex-grow: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid var(--card-border);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
            cursor: pointer;
        }

        .search-input:focus, select.search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-clear {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            color: var(--text-color);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-clear:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .counter-results {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: -5px;
            margin-bottom: 5px;
            padding-left: 2px;
        }

        /* ==========================================
           CONTENEDOR Y TARJETAS EN 2 COLUMNAS
           ========================================== */
        #contenedor-partidas {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card-partida {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: row; 
            transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.06);
        }

        .card-partida:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .card-img-container {
            width: 190px;
            min-width: 190px;
            background-color: var(--img-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--card-border);
            transition: background-color 0.3s;
            padding: 10px;
            box-sizing: border-box;
        }

        .card-img-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
        }

        .card-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .card-img:hover {
            transform: scale(1.03);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-body h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            letter-spacing: -0.2px;
        }

        .header-tags {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 10px;
        }

        .genre-tags-wrapper {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            flex-grow: 1;
        }

        .genre-tag {
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 4px;
            background-color: var(--tag-bg);
            color: var(--text-muted);
            font-weight: 500;
        }

        .system-tag {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .desc-container {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .desc-text {
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0 0 4px 0;
        }

        .card-partida.expanded .desc-text {
            display: block;
            -webkit-line-clamp: unset;
        }

        .btn-toggle-desc {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 0;
            margin-top: 2px;
            display: none;
        }

        .btn-toggle-desc:hover {
            text-decoration: underline;
        }

        .aviso {
            font-size: 0.75rem;
            color: var(--warning-text);
            margin-bottom: 12px;
            background: var(--warning-bg);
            padding: 5px 8px;
            border-radius: 4px;
            border-left: 2px solid var(--warning-text);
            font-weight: 400;
            opacity: 0.85;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
        }

        .discord-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--discord-bg);
            color: var(--discord-text);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 10px 16px;
            border-radius: 6px;
            transition: all 0.2s ease;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .discord-link:hover {
            background-color: var(--discord-hover);
            color: var(--discord-hover-text);
            text-decoration: none;
        }

        /* ==========================================
           BOTONES FLOTANTES INFERIORES
           ========================================== */
        .floating-btn-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 9999;
        }

        .floating-action-btn, .scroll-top-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--card-border);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        .floating-action-btn:hover, .scroll-top-btn:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            transform: scale(1.1);
        }

        .scroll-top-btn {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s, transform 0.2s, background-color 0.2s, color 0.2s;
        }

        .scroll-top-btn.show {
            opacity: 1;
            visibility: visible;
        }

        .loading, .no-results {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            padding: 40px;
        }

        @media (max-width: 768px) {
            #contenedor-partidas {
                grid-template-columns: 1fr;
            }
            .card-partida {
                flex-direction: column;
            }
            .card-img-container {
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: flex-start;
                gap: 15px;
                border-right: none;
                border-bottom: 1px solid var(--card-border);
            }
            .card-img-wrapper {
                width: 140px;
                height: 140px;
            }
            .select-filters-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="images/gorre_l.png" alt="Gorre Logo" class="logo-header">
        <h1>Listado de Partidas</h1>
    </header>

    <div class="controls-container">
        <!-- Buscador y Botón de Limpieza con Escoba -->
        <div class="search-filter-row">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar por nombre, sistema, género...">
            <button id="btn-clear-filters" class="btn-clear" title="Limpiar filtros y búsqueda"><i class="fa-solid fa-broom"></i></button>
        </div>
        <!-- Listas desplegables para sistemas y tags -->
        <div class="select-filters-row">
            <select id="linea-select" class="search-input"></select>
            <select id="tag-select" class="search-input"></select>
        </div>
        <div id="counter-results" class="counter-results">Cargando...</div>
    </div>

    <main>
        <div id="contenedor-partidas">
            <div class="loading">Cargando partidas del Google Sheet...</div>
        </div>
    </main>

    <!-- BOTONES FLOTANTES INFERIORES ORDENADOS -->
    <div class="floating-btn-container">
        <button class="floating-action-btn theme-toggle-btn" title="Cambiar modo claro/oscuro"><i class="fa-solid fa-moon"></i></button>
        <a href="index.html" class="floating-action-btn" title="Volver al Inicio"><i class="fa-solid fa-house"></i></a>
        <button id="scrollTopBtn" class="scroll-top-btn" onclick="scrollToTop()" title="Subir arriba"><i class="fa-solid fa-arrow-up"></i></button>
    </div>

    <script>
        const themeToggleBtns = document.querySelectorAll(".theme-toggle-btn");
        
        function actualizarInterfaz() {
            const esClaro = document.body.classList.contains("light-mode");
            
            const iconosCalendario = document.querySelectorAll(".calendar-icon");
            iconosCalendario.forEach(el => {
                if (esClaro) {
                    el.className = "fa-solid fa-calendar calendar-icon";
                } else {
                    el.className = "fa-regular fa-calendar calendar-icon";
                }
            });

            themeToggleBtns.forEach(btn => {
                if (esClaro) {
                    btn.innerHTML = '<i class="fa-regular fa-sun"></i>';
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
                }
            });
        }

        themeToggleBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                document.body.classList.toggle("light-mode");
                actualizarInterfaz();
            });
        });

        window.addEventListener("scroll", () => {
            const scrollTopBtn = document.getElementById("scrollTopBtn");
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add("show");
            } else {
                scrollTopBtn.classList.remove("show");
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function parsearFechaEspanola(textoFecha) {
            if (!textoFecha) return null;
            const partes = textoFecha.trim().split(/[-/]/);
            if (partes.length !== 3) return null;
            
            const dia = parseInt(partes[0], 10);
            const mes = parseInt(partes[1], 10) - 1;
            const anio = parseInt(partes[2], 10);
            
            const fecha = new Date(anio, mes, dia);
            return isNaN(fecha.getTime()) ? null : fecha;
        }

        let listaPartidas = [];
        let lineaSeleccionada = "TODAS";
        let tagSeleccionado = "TODOS";

        async function cargarPartidas() {
            const url = "https://docs.google.com/spreadsheets/d/1hX6Y0wqFcoyBsIQXkgypgogijbrTSqZRJGRw5Lqh9Ek/export?format=tsv";
            const contenedor = document.getElementById("contenedor-partidas");

            try {
                const respuesta = await fetch(url);
                const texto = await respuesta.text();
                
                const filas = texto.split("\n");
                listaPartidas = [];

                for (let i = 1; i < filas.length; i++) {
                    if (!filas[i].trim()) continue;
                    
                    const columnas = filas[i].split("\t");
                    
                    const partida = {
                        titulo: columnas[0] || "",
                        linea: columnas[1] || "",
                        genero: columnas[2] || "",
                        descripcion: columnas[3] || "",
                        portada: columnas[4] || "",
                        aviso: columnas[5] || "",
                        jugadores: columnas[6] || "",
                        sesiones: columnas[7] || "",
                        linkDiscord: columnas[8] || "",
                        publicarEn: columnas[9] ? columnas[9].trim() : ""
                    };

                    if (!partida.publicarEn) continue;
                    const fechaPublicacion = parsearFechaEspanola(partida.publicarEn);
                    if (!fechaPublicacion) continue;

                    const hoy = new Date();
                    fechaPublicacion.setHours(0, 0, 0, 0);
                    hoy.setHours(0, 0, 0, 0);

                    if (fechaPublicacion > hoy) continue;

                    listaPartidas.push(partida);
                }

                listaPartidas.sort((a, b) => {
                    const sistemaA = a.linea.toLowerCase();
                    const sistemaB = b.linea.toLowerCase();
                    if (sistemaA < sistemaB) return -1;
                    if (sistemaA > sistemaB) return 1;

                    const tituloA = a.titulo.toLowerCase();
                    const tituloB = b.titulo.toLowerCase();
                    if (tituloA < tituloB) return -1;
                    if (tituloA > tituloB) return 1;
                    return 0;
                });

                generarListasDesplegables();
                renderizarPartidas(listaPartidas);

            } catch (error) {
                console.error("Error al obtener las partidas:", error);
                contenedor.innerHTML = "<p class='loading'>Hubo un error al cargar las partidas. Revisa la conexión o los permisos del Google Sheet.</p>";
                document.getElementById("counter-results").textContent = "Error al cargar partidas";
            }
        }

        function generarListasDesplegables() {
            const selectLinea = document.getElementById("linea-select");
            const selectTag = document.getElementById("tag-select");
            
            // Extraer líneas únicas y ordenarlas alfabéticamente
            const lineasUnicas = [...new Set(listaPartidas.map(p => p.linea).filter(l => l !== ""))];
            lineasUnicas.sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
            
            // Extraer tags únicos y ordenarlos alfabéticamente
            let todosLosTags = [];
            listaPartidas.forEach(p => {
                if (p.genero) {
                    const tagsPartida = p.genero.match(/#[\wáéíóú]+/g) || p.genero.split(/\s+/);
                    tagsPartida.forEach(t => {
                        let tagLimpio = t.trim();
                        if (tagLimpio) {
                            if (!tagLimpio.startsWith('#')) tagLimpio = '#' + tagLimpio;
                            todosLosTags.push(tagLimpio);
                        }
                    });
                }
            });
            const tagsUnicos = [...new Set(todosLosTags)];
            tagsUnicos.sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));

            let htmlLineas = `<option value="TODAS">Todos los sistemas</option>`;
            lineasUnicas.forEach(linea => {
                htmlLineas += `<option value="${linea}">${linea}</option>`;
            });
            selectLinea.innerHTML = htmlLineas;
            selectLinea.value = lineaSeleccionada;

            let htmlTags = `<option value="TODOS">Todos los tags</option>`;
            tagsUnicos.forEach(tag => {
                htmlTags += `<option value="${tag}">${tag}</option>`;
            });
            selectTag.innerHTML = htmlTags;
            selectTag.value = tagSeleccionado;

            selectLinea.onchange = (e) => {
                lineaSeleccionada = e.target.value;
                filtrarYRenderizar();
            };

            selectTag.onchange = (e) => {
                tagSeleccionado = e.target.value;
                filtrarYRenderizar();
            };
        }

        function renderizarPartidas(partidasAMostrar) {
            const contenedor = document.getElementById("contenedor-partidas");
            const contadorDiv = document.getElementById("counter-results");
            
            contenedor.innerHTML = "";

            const total = partidasAMostrar.length;
            if (total === 1) {
                contadorDiv.textContent = "Mostrando 1 partida";
            } else {
                contadorDiv.textContent = `Mostrando ${total} partidas`;
            }

            if (total === 0) {
                contenedor.innerHTML = "<p class='no-results'>No se ha encontrado ninguna partida con esos criterios.</p>";
                return;
            }

            partidasAMostrar.forEach(partida => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "card-partida";
                
                const esClaro = document.body.classList.contains("light-mode");
                const claseCalendario = esClaro ? "fa-solid fa-calendar calendar-icon" : "fa-regular fa-calendar calendar-icon";

                let textoSesiones = partida.sesiones.trim();
                if (textoSesiones === "1" || textoSesiones.toLowerCase() === "1 sesiones") {
                    textoSesiones = "One-Shot";
                } else if (textoSesiones && !textoSesiones.toLowerCase().includes("sesiones") && !textoSesiones.toLowerCase().includes("one-shot")) {
                    textoSesiones = textoSesiones + " sesiones";
                } else if (!textoSesiones) {
                    textoSesiones = "One-Shot";
                }

                let htmlGeneros = '';
                if (partida.genero) {
                    const generosArray = partida.genero.split(/[\s,]+/);
                    generosArray.forEach(g => {
                        if(g.trim()) {
                            let tag = g.trim();
                            if(!tag.startsWith('#')) tag = '#' + tag;
                            htmlGeneros += `<span class="genre-tag">${tag}</span>`;
                        }
                    });
                }

                tarjeta.innerHTML = `
                    <div class="card-img-container">
                        <div class="card-img-wrapper">
                            ${partida.portada ? `<img src="${partida.portada}" alt="${partida.titulo}" class="card-img" onerror="this.parentElement.parentElement.style.display='none'">` : ''}
                        </div>
                    </div>
                    <div class="card-body">
                        <h3>${partida.titulo}</h3>
                        <div class="header-tags">
                            <div class="genre-tags-wrapper">
                                ${htmlGeneros}
                            </div>
                            ${partida.linea ? `<span class="system-tag">${partida.linea}</span>` : ''}
                        </div>
                        <div class="desc-container">
                            <p class="desc-text">${partida.descripcion}</p>
                            <button class="btn-toggle-desc">+ info</button>
                        </div>
                        ${partida.aviso ? `<div class="aviso"><strong>⚠️ Aviso:</strong> ${partida.aviso}</div>` : ''}
                        <div class="meta">
                            <span><i class="fa-solid fa-users"></i> ${partida.jugadores ? partida.jugadores + ' jugadores' : 'Plazas abiertas'}</span>
                            <span><i class="${claseCalendario}"></i> ${textoSesiones}</span>
                        </div>
                        ${partida.linkDiscord ? `<a href="${partida.linkDiscord}" target="_blank" class="discord-link">Unirse a Discord <i class="fa-brands fa-discord"></i></a>` : ''}
                    </div>
                `;

                setTimeout(() => {
                    const descText = tarjeta.querySelector('.desc-text');
                    const btnToggle = tarjeta.querySelector('.btn-toggle-desc');
                    if (descText && btnToggle) {
                        if (descText.scrollHeight > descText.clientHeight + 4) {
                            btnToggle.style.display = "inline-block";
                        }
                    }
                }, 100);

                const btnToggle = tarjeta.querySelector('.btn-toggle-desc');
                if (btnToggle) {
                    btnToggle.addEventListener('click', () => {
                        tarjeta.classList.toggle('expanded');
                        if (tarjeta.classList.contains('expanded')) {
                            btnToggle.textContent = "- ver menos";
                        } else {
                            btnToggle.textContent = "+ info";
                        }
                    });
                }

                contenedor.appendChild(tarjeta);
            });
        }

        function filtrarYRenderizar() {
            const textoBusqueda = document.getElementById("search-input").value.toLowerCase().trim();

            const filtradas = listaPartidas.filter(partida => {
                const coincideLinea = (lineaSeleccionada === "TODAS" || partida.linea === lineaSeleccionada);
                
                let coincideTag = true;
                if (tagSeleccionado !== "TODOS") {
                    coincideTag = partida.genero && partida.genero.toLowerCase().includes(tagSeleccionado.toLowerCase());
                }

                const textoCompleto = `${partida.titulo} ${partida.linea} ${partida.genero} ${partida.descripcion}`.toLowerCase();
                const coincideTexto = textoCompleto.includes(textoBusqueda);

                return coincideLinea && coincideTag && coincideTexto;
            });

            renderizarPartidas(filtradas);
        }

        document.getElementById("search-input").addEventListener("input", filtrarYRenderizar);

        document.getElementById("btn-clear-filters").addEventListener("click", () => {
            document.getElementById("search-input").value = "";
            lineaSeleccionada = "TODAS";
            tagSeleccionado = "TODOS";
            
            document.getElementById("linea-select").value = "TODAS";
            document.getElementById("tag-select").value = "TODOS";

            renderizarPartidas(listaPartidas);
        });

        cargarPartidas();
    </script>
</body>
</html>
